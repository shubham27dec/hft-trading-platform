apiVersion: v1
kind: ConfigMap
metadata:
  name: hft-config
  namespace: hft
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  DB_HOST: "postgres"
  WATCHED_SYMBOLS: "AAPL,TSLA,NVDA,MSFT,AMZN"
  JWT_ISSUER_URI: "http://keycloak:8080/realms/hft"
  JWT_JWK_SET_URI: "http://keycloak:8080/realms/hft/protocol/openid-connect/certs"
  KEYCLOAK_ADMIN_URL: "http://keycloak:8080"
  KEYCLOAK_ADMIN_USER: "admin"
  WAL_PATH: "/data/wal"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: realm-hft-config
  namespace: hft
data:
  realm-hft.json: |
    {
      "realm": "hft",
      "displayName": "HFT Trading Platform",
      "enabled": true,
      "sslRequired": "none",
      "registrationAllowed": false,
      "loginTheme": "keycloak",
      "accessTokenLifespan": 3600,
      "refreshTokenMaxReuse": 0,
      "clients": [
        {
          "clientId": "hft-frontend",
          "name": "HFT Frontend",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": [
            "http://localhost:5173/*",
            "http://localhost:5174/*"
          ],
          "webOrigins": [
            "http://localhost:5173",
            "http://localhost:5174"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256"
          }
        }
      ],
      "identityProviders": [
        {
          "alias": "google",
          "providerId": "google",
          "enabled": true,
          "config": {
            "clientId": "${GOOGLE_CLIENT_ID}",
            "clientSecret": "${GOOGLE_CLIENT_SECRET}",
            "defaultScope": "openid email profile"
          }
        }
      ],
      "users": [
        {
          "id": "00000000-0000-0000-0000-000000000001",
          "username": "trader",
          "enabled": true,
          "emailVerified": true,
          "firstName": "HFT",
          "lastName": "Trader",
          "email": "trader@hft.local",
          "credentials": [
            {
              "type": "password",
              "value": "trader123",
              "temporary": false
            }
          ]
        }
      ]
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: hft
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: order-entry-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['order-entry-service:8080']

      - job_name: position-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['position-service:8081']

      - job_name: risk-dashboard-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['risk-dashboard-service:8082']

      - job_name: notification-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['notification-service:8083']

      - job_name: audit-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['audit-service:8084']
