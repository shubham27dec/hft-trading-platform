apiVersion: apps/v1
kind: Deployment
metadata:
  name: position-service
  namespace: hft
spec:
  replicas: 2
  selector:
    matchLabels:
      app: position-service
  template:
    metadata:
      labels:
        app: position-service
    spec:
      containers:
        - name: position-service
          image: hft-trading-platform-position-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: hft-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: hft-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: hft-config
                  key: REDIS_PORT

---
apiVersion: v1
kind: Service
metadata:
  name: position-service
  namespace: hft
spec:
  selector:
    app: position-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30081
  type: NodePort
