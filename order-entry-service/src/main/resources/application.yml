server:
  port: 8080

spring:
  application:
    name: order-entry-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/hft
    username: ${DB_USER:hft}
    password: ${DB_PASSWORD:hft}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: accounts
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/hft}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/hft/protocol/openid-connect/certs}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.hft: DEBUG

alpaca:
  api:
    key-id: ${ALPACA_KEY_ID:}
    secret-key: ${ALPACA_SECRET_KEY:}
  data:
    base-url: https://data.alpaca.markets

keycloak:
  admin:
    base-url: ${KEYCLOAK_ADMIN_URL:http://localhost:8180}
    username: ${KEYCLOAK_ADMIN_USER:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

watched:
  symbols: ${WATCHED_SYMBOLS:AAPL,TSLA,NVDA,MSFT,AMZN,GOOGL,META,AMD,NFLX,SPY}

