global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: order-entry-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-entry-service:8080"]

  - job_name: position-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["position-service:8081"]

  - job_name: risk-dashboard-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["risk-dashboard-service:8082"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8083"]

  - job_name: audit-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["audit-service:8084"]
