name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'sapmachine'
          cache: maven
      - run: mvn install -DskipTests --batch-mode

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'sapmachine'
          cache: maven
      - run: mvn test --batch-mode

  karate-tests:
    name: Karate API Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'sapmachine'
          cache: maven
      - run: mvn test -Pkarate --batch-mode

  integration-tests:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'sapmachine'
          cache: maven
      - run: mvn verify -Pintegration --batch-mode

  owasp:
    name: OWASP Dependency Check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'sapmachine'
          cache: maven
      - name: Cache OWASP NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp
          key: ${{ runner.os }}-owasp-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-owasp
      - run: mvn org.owasp:dependency-check-maven:check --batch-mode

  sonar:
    name: SonarCloud
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'sapmachine'
          cache: maven
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=shubham27dec_hft-trading-platform -Dsonar.organization=shubham27dec -Dsonar.host.url=https://sonarcloud.io -Dsonar.branch.name=main -Dsonar.qualitygate.wait=true "-Dsonar.coverage.exclusions=**/feed/FeedHandler.java,**/aeron/AeronPublishHandler.java,**/aeron/AeronOrderSubscriber.java,**/wal/ChronicleWAL.java,**/kafka/FillKafkaProducer.java,**/kafka/OrderEventConsumer.java,**/ExecutionEngineMain.java" --batch-mode
