services:

  # ── Infrastructure ─────────────────────────────────────────────────────────

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: keycloak
    entrypoint: ["/bin/bash", "-c"]
    command: ["sed 's|$${GOOGLE_CLIENT_ID}|${GOOGLE_CLIENT_ID}|g;s|$${GOOGLE_CLIENT_SECRET}|${GOOGLE_CLIENT_SECRET}|g' /tmp/realm-hft.json.template > /tmp/realm-hft.json && mkdir -p /opt/keycloak/data/import && cp /tmp/realm-hft.json /opt/keycloak/data/import/realm-hft.json && /opt/keycloak/bin/kc.sh start-dev --import-realm"]
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_URL: http://localhost:8180
      KC_HTTP_ENABLED: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./docker/keycloak/realm-hft.json:/tmp/realm-hft.json.template
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: hft
      POSTGRES_USER: ${DB_USER:-hft}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hft}
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hft} -d hft"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lfu
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Application Services ───────────────────────────────────────────────────

  order-entry-service:
    build:
      context: .
      target: order-entry-service
    container_name: order-entry-service
    ports:
      - "8085:8080"
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER:-hft}
      DB_PASSWORD: ${DB_PASSWORD:-hft}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ALPACA_KEY_ID: ${ALPACA_KEY_ID}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY}
      JWT_ISSUER_URI: http://localhost:8180/realms/hft
      JWT_JWK_SET_URI: http://keycloak:8080/realms/hft/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    depends_on:
      kafka:     { condition: service_healthy }
      postgres:  { condition: service_healthy }
      redis:     { condition: service_healthy }
      keycloak:  { condition: service_healthy }

  position-service:
    build:
      context: .
      target: position-service
    container_name: position-service
    ports:
      - "8081:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }

  risk-dashboard-service:
    build:
      context: .
      target: risk-dashboard-service
    container_name: risk-dashboard-service
    ports:
      - "8082:8082"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka: { condition: service_healthy }

  notification-service:
    build:
      context: .
      target: notification-service
    container_name: notification-service
    ports:
      - "8083:8083"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka: { condition: service_healthy }

  audit-service:
    build:
      context: .
      target: audit-service
    container_name: audit-service
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER:-hft}
      DB_PASSWORD: ${DB_PASSWORD:-hft}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:    { condition: service_healthy }
      postgres: { condition: service_healthy }

  execution-engine:
    build:
      context: .
      target: execution-engine
    container_name: execution-engine
    shm_size: '256m'
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ALPACA_KEY_ID: ${ALPACA_KEY_ID}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY}
      WAL_PATH: /data/wal
      WATCHED_SYMBOLS: ${WATCHED_SYMBOLS:-AAPL,TSLA,NVDA,MSFT,AMZN,GOOGL,META,AMD,NFLX,SPY}
      JAVA_TOOL_OPTIONS: "--add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.misc=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/jdk.internal.ref=ALL-UNNAMED --add-opens=java.base/java.lang.ref=ALL-UNNAMED"
    volumes:
      - wal-data:/data/wal
    depends_on:
      kafka: { condition: service_healthy }

  # ── Monitoring ─────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - order-entry-service
      - position-service
      - risk-dashboard-service
      - notification-service
      - audit-service

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  wal-data:
  grafana-data:
  keycloak-data:
